[package]
name = "jard-desktop"
version = "0.1.7"
description = "Jard desktop app (Tauri shell around jard-scan)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "jard_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jard-scan = { path = "../../../crates/jard-scan" }
jard-clean = { path = "../../../crates/jard-clean" }
jard-license = { path = "../../../crates/jard-license" }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }
