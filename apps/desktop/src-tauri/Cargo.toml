[package]
name = "jard-desktop"
version = "0.1.0"
description = "Jard desktop app (Tauri shell around jard-scan)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "jard_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jard-scan = { path = "../../../crates/jard-scan" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
