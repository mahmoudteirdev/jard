name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the version, and updates must be signed
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in tauri.conf.json"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing. See docs/RELEASING.md"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Web build
        working-directory: apps/desktop
        run: pnpm build

      - name: Tests
        run: cargo test --workspace

      - name: Build the signed installer, portable copy and update file
        working-directory: apps/desktop
        run: |
          pnpm tauri build --config src-tauri/tauri.release.conf.json
          node scripts/portable.mjs
          node scripts/latest-json.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/portable/*.zip
            target/release/bundle/latest.json

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the version, and the APK must be signed
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in build.gradle.kts"
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::The Android signing secrets are missing. See docs/RELEASING.md"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner already has the SDK. Gradle fetches the exact platform once the licenses are accepted.
      - name: Accept the Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests and signed APK
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=jard" \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEYSTORE_PASSWORD"
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/Jard_${GITHUB_REF_NAME#v}_android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/out/*.apk

  publish:
    name: Publish the release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Fingerprints, so a download can be checked
        working-directory: files
        run: |
          find . -type f -not -name latest.json -exec mv {} . \; 2>/dev/null || true
          find . -mindepth 2 -type f -name latest.json -exec mv {} . \; 2>/dev/null || true
          sha256sum *.exe *.zip *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            files/*.exe
            files/*.zip
            files/*.apk
            files/latest.json
            files/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
