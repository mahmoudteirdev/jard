[package]
name = "jard-scan"
version = "0.1.0"
description = "Jard disk scan engine: parallel walker that builds a flat size tree (apparent, on disk, cloud, hardlinks)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
