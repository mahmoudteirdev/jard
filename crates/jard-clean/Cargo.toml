[package]
name = "jard-clean"
version = "0.1.0"
description = "Jard quarantine: moves files aside for 30 days with undo, and refuses protected system paths."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jard-scan = { path = "../jard-scan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1"
